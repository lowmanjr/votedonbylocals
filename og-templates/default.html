<!--
  OG IMAGE TEMPLATE — SITE DEFAULT (1200×630)
  ────────────────────────────────────────────
  Source of truth for the site default Open Graph share-preview image.
  Rendered headlessly by scripts/generate_og_images.py via Playwright,
  output to assets/images/og-default.png.

  Used by index.html. Note that index.html is the only page where this
  og:image declaration is genuinely new — every other page in the site
  already declared og:image meta pointed at a (previously 404'd) URL,
  so step 5 fulfills 41 existing promises and adds 1 new declaration.

  ──────────────────────────────────────────────────────────────────
  Per-image content fields:
    None. The default image has no per-instance data — it's a static
    site-identity card, rendered once.

  Brand color placeholders (substituted from tailwind.config.js by the
  script — single source of truth):
    {{brandOrange}} {{brandCream}} {{brandDark}} {{brandGray}}

  ──────────────────────────────────────────────────────────────────
  Intentional design decisions — DO NOT "fix" without explicit discussion:

    1. Mirrors ranking.html structure exactly. Same brand-mark lockup,
       same right-side dot panel, same headline stack (eyebrow / hero /
       accent rule / meta), same typographic scale. The default reads
       as a member of the site's image family, not a separate identity.

    2. Copy: eyebrow "Charleston" / hero "Restaurants" (orange) / meta
       "As voted by Charleston locals". Composes as "Charleston
       Restaurants" — honest description of what the site is, mirroring
       the ranking pattern of "Best {Category}".

    3. No spots count in meta. The default isn't a ranking — there's
       no N to count — so the meta line drops the second piece that
       ranking.html carries. Just the canonical voice line stands alone.

    4. No date in the meta. Same reasoning as ranking.html intentional
       decision #1 — avoid cache invalidation on monthly refresh.

    5. Static template, no per-image data substitution. Only the
       four brand-color placeholders are substituted at render time.
       The script renders this template at run-time rather than
       checking in a hand-edited PNG so brand-color changes in
       tailwind.config.js propagate to the default image automatically
       on the next batch.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG · Default</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-orange: {{brandOrange}};
    --brand-cream:  {{brandCream}};
    --brand-dark:   {{brandDark}};
    --brand-gray:   {{brandGray}};
    --orange-50:    #FFF7ED;
    --gray-800:     #1F2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--brand-cream);
    color: var(--brand-dark);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  .dot-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 480px;
    height: 100%;
    background-image: radial-gradient(var(--brand-orange) 1.5px, transparent 1.5px);
    background-size: 30px 30px;
    opacity: 0.7;
  }

  .brand-mark {
    position: absolute;
    top: 56px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark .icon-bg {
    background: var(--orange-50);
    border-radius: 10px;
    padding: 8px;
    display: flex;
  }
  .brand-mark svg { width: 28px; height: 28px; color: var(--brand-orange); }
  .brand-mark .wordmark {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gray-800);
    letter-spacing: -0.015em;
  }

  .headline {
    position: absolute;
    left: 64px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 720px;
  }
  .eyebrow {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 36px;
    color: var(--brand-gray);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .category {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 132px;
    line-height: 1.0;
    color: var(--brand-dark);
    letter-spacing: -0.04em;
  }
  .category .accent { color: var(--brand-orange); }
  .accent-rule {
    width: 96px;
    height: 5px;
    background: var(--brand-orange);
    border-radius: 999px;
    margin: 28px 0 24px;
  }
  .meta {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--brand-gray);
    letter-spacing: -0.005em;
  }
</style>
</head>
<body>
  <div class="dot-panel"></div>

  <div class="brand-mark">
    <div class="icon-bg">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M12 2.25c-4.473 0-8.106 3.633-8.106 8.106 0 4.472 8.106 11.394 8.106 11.394s8.106-6.922 8.106-11.394C20.106 5.883 16.473 2.25 12 2.25Zm0 11.25a3.375 3.375 0 1 0 0-6.75 3.375 3.375 0 0 0 0 6.75Z" clip-rule="evenodd" />
      </svg>
    </div>
    <span class="wordmark">Voted On By Locals</span>
  </div>

  <div class="headline">
    <div class="eyebrow">Charleston</div>
    <div class="category"><span class="accent">Restaurants</span></div>
    <div class="accent-rule"></div>
    <div class="meta">As voted by Charleston locals</div>
  </div>
</body>
</html>
