<!--
  OG IMAGE TEMPLATE — DETAIL PAGES (1200×630)
  ────────────────────────────────────────────
  Source of truth for the per-restaurant Open Graph share-preview image.
  Rendered headlessly by scripts/generate_og_images.py via Playwright,
  output to assets/images/og-restaurant-{slug}.png. Note the
  'og-restaurant-' prefix — different from rankings, which use just
  'og-{slug}.png' (verified by sweeping all 33 detail-page declarations).

  ──────────────────────────────────────────────────────────────────
  Per-image content fields:
    {{RestaurantName}}    display name, e.g. "FIG"
    {{NameFontSize}}      adaptive font-size string, e.g. "132px" / "108px"
                          / "84px". Computed by the script from name length
                          via compute_name_font_size() — three tiers,
                          generic logic, not hand-curated.
    {{MetaLine}}          "{Cuisine} · {Neighborhood}" composed by the
                          script. For mobile vendors with null
                          neighborhood, the script renders just
                          "{Cuisine}" (no trailing separator).

  Brand color placeholders (substituted from tailwind.config.js by the
  script — single source of truth):
    {{brandOrange}} {{brandCream}} {{brandDark}} {{brandGray}}

  ──────────────────────────────────────────────────────────────────
  Intentional design decisions — DO NOT "fix" without explicit discussion:

    1. Unified composition with ranking. Detail uses the same
       left-anchored headline + right-side dot-panel structure as
       ranking.html. Only difference: detail has no eyebrow ("Best"
       in ranking) above the name. Reasoning: an earlier centered
       composition with bottom-right dot accent read as three
       disconnected zones (lockup → name → corner accent) instead of
       one composition. Unifying the structure makes the share
       previews feel like a single brand system across page types,
       not two unrelated treatments.

    2. Restaurant name in --brand-dark, NOT orange. Orange-on-word
       in ranking signals the cuisine word ({Pizza}, {Burger}, etc.).
       In detail, the cuisine lives in the meta line below the name,
       not the hero. Hero stays neutral so the orange accent rule
       and the dot panel carry the brand color.

    3. Adaptive font sizing — three tiers based on name length:
         ≤14 chars  → 132px   (matches ranking's hero size)
         15-22 chars → 108px
         ≥23 chars  → 84px
       Cutoffs chosen empirically against the 33 restaurants in the
       dataset. The worst case ("Bon Banh Mi Southeast Asian Kitchen",
       35 chars) wraps to ~3 lines at 84px in the 720px max-width
       headline area. If a future restaurant name exceeds what 84px
       can fit, add a fourth tier (~64px) rather than letting the
       layout overflow silently.

    4. Same brand-mark lockup as ranking (top-left), same dot panel
       (right-side, opacity 0.7, 1.5px dots, 30px grid). Cross-template
       consistency matters more than per-page differentiation here.

    5. No emoji, no URL stamp. Same reasoning as ranking.html
       intentional decisions #6 and #7 — applied uniformly.

    6. No tagline. The on-site detail hero
       (_detail-page-template.html line 405-408) renders a tagline
       below the cuisine·neighborhood subtitle in italic. OG drops
       it — three lines of text in the headline stack (name + meta +
       tagline) crowds the share preview at small display sizes,
       and the tagline often duplicates information already in the
       meta line.

    7. No Tailwind dependency, same as ranking. Brand colors
       substituted from tailwind.config.js at render time.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG · Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-orange: {{brandOrange}};
    --brand-cream:  {{brandCream}};
    --brand-dark:   {{brandDark}};
    --brand-gray:   {{brandGray}};
    --orange-50:    #FFF7ED;
    --gray-800:     #1F2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--brand-cream);
    color: var(--brand-dark);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Right-side dot panel — identical to ranking.html (1.5px dots,
     30px grid, opacity 0.7) for cross-template consistency. */
  .dot-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 480px;
    height: 100%;
    background-image: radial-gradient(var(--brand-orange) 1.5px, transparent 1.5px);
    background-size: 30px 30px;
    opacity: 0.7;
  }

  /* Brand mark — same lockup and position as ranking.html. */
  .brand-mark {
    position: absolute;
    top: 56px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark .icon-bg {
    background: var(--orange-50);
    border-radius: 10px;
    padding: 8px;
    display: flex;
  }
  .brand-mark svg { width: 28px; height: 28px; color: var(--brand-orange); }
  .brand-mark .wordmark {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gray-800);
    letter-spacing: -0.015em;
  }

  /* Headline stack — same position and max-width as ranking.html, but
     no eyebrow above the name (the only structural difference). */
  .headline {
    position: absolute;
    left: 64px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 720px;
  }
  .name {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: {{NameFontSize}};
    line-height: 1.05;
    color: var(--brand-dark);
    letter-spacing: -0.04em;
  }
  .accent-rule {
    width: 96px;
    height: 5px;
    background: var(--brand-orange);
    border-radius: 999px;
    margin: 28px 0 24px;
  }
  .meta {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--brand-gray);
    letter-spacing: -0.005em;
  }
</style>
</head>
<body>
  <div class="dot-panel"></div>

  <div class="brand-mark">
    <div class="icon-bg">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M12 2.25c-4.473 0-8.106 3.633-8.106 8.106 0 4.472 8.106 11.394 8.106 11.394s8.106-6.922 8.106-11.394C20.106 5.883 16.473 2.25 12 2.25Zm0 11.25a3.375 3.375 0 1 0 0-6.75 3.375 3.375 0 0 0 0 6.75Z" clip-rule="evenodd" />
      </svg>
    </div>
    <span class="wordmark">Voted On By Locals</span>
  </div>

  <div class="headline">
    <div class="name">{{RestaurantName}}</div>
    <div class="accent-rule"></div>
    <div class="meta">{{MetaLine}}</div>
  </div>
</body>
</html>
